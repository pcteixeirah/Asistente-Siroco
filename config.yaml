# ============================================
# SIROCO - Configuración (Spotify API Pivot)
# ============================================

paths:
  database: "data/siroco_registry.db"
  log_file: "logs/process.log"
  auth_config: "setup/headers_auth.cfg"

playlist:
  default_id: "PLXlz4-GmC7VsuHrQgBg40CHHqFftdVNqJ"

# Configuración general de procesamiento
batch:
  size: 50
  delay_seconds: 2
  max_retries: 3
  max_tracks_to_process: 500

# Parámetros de la API
spotify:
  # Las credenciales reales deben ir en el archivo .env
  # SPOTIFY_CLIENT_ID y SPOTIFY_CLIENT_SECRET
  timeout_seconds: 15
  max_retries: 5
