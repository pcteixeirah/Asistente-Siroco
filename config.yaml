# ============================================
# SIROCO - Configuración (GetSongBPM API)
# ============================================

paths:
  database: "data/siroco_registry.db"
  log_file: "logs/process.log"
  auth_config: "setup/headers_auth.cfg"

playlist:
  default_id: "PLXlz4-GmC7VsuHrQgBg40CHHqFftdVNqJ"

# Configuración general de procesamiento
batch:
  size: 50
  delay_seconds: 2
  max_retries: 3
  max_tracks_to_process: 0  # 0 = sin límite

# GetSongBPM API
getsongbpm:
  base_url: "https://api.getsong.co"
  # API key se carga desde .env (GETSONGBPM_API_KEY)
  match_threshold: 0.65   # Umbral mínimo de similitud para aceptar un match
  rate_limit_rpm: 50      # Requests por minuto (conservador)
